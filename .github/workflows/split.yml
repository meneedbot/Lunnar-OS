name: Split the HTML into files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Split
        run: |
          node tools/split.mjs
          node tools/modularize.mjs

      - name: Commit the result
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to split."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split the OS into css, js and data files"
          git pull --rebase --autostash
          git push
