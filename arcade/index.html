<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Drift — Lunaar Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="hud">
    <div class="hud__block"><span class="hud__label">Score</span><strong id="score">0</strong></div>
    <div class="hud__block"><span class="hud__label">Best</span><strong id="best">0</strong></div>
    <div class="hud__block hud__block--right"><span class="hud__label">Level</span><strong id="level-num">1</strong></div>
  </header>

  <div class="wrap">
    <canvas id="board" aria-label="Neon Drift game board"></canvas>
    <section class="overlay" id="overlay">
      <h1 class="overlay__title" id="ov-title">NEON DRIFT</h1>
      <p class="overlay__sub" id="ov-sub">Dodge the blocks. Collect the light.</p>
      <button class="overlay__btn" id="start" type="button">Start</button>
      <p class="hint">Arrows or A / D to move &middot; drag on touch</p>
    </section>
  </div>

  <footer class="bar">
    <a href="../index.html">&larr; LunaarOS</a>
    <span>Lunaar Arcade</span>
  </footer>
</main>
<script src="game.js" defer></script>
</body>
</html>
